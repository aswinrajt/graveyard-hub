<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>

    <!-- Neon Cyberpunk Border -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Skull Shading -->
    <linearGradient id="skullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Toxic Green Eyes Glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bgGrad)" stroke="url(#cyberBorder)" stroke-width="2.5"/>

  <!-- Cyber Corner Tech Marks -->
  <path d="M7 16V9H14" stroke="#c026d3" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M57 16V9H50" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7 48V55H14" stroke="#9333ea" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M57 48V55H50" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Skull Silhouette -->
  <g filter="url(#neonGlow)">
    <!-- Skull Shape -->
    <path d="M21 34.5 C17 31 16 26 16 22 C16 13.5 23.2 8 32 8 C40.8 8 48 13.5 48 22 C48 26 47 31 43 34.5 C44.5 37 44.5 41 43.5 43 C42.5 44 40 44 39 44 L39 49 C39 50.5 37.5 52 36 52 L28 52 C26.5 52 25 50.5 25 49 L25 44 C24 44 21.5 44 20.5 43 C19.5 41 19.5 37 21 34.5 Z" 
          fill="url(#skullGrad)" 
          stroke="#07060a" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- Cyber Forehead Inlay Cut -->
    <path d="M27 15 L32 19 L37 15" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="32" cy="14" r="1.5" fill="#22c55e"/>

    <!-- Toxic Green Glowing Eyes -->
    <path d="M23.5 25 L29 23.5 L28 30.5 L22.5 31 Z" fill="url(#eyeGlow)" stroke="#14532d" stroke-width="0.8"/>
    <path d="M40.5 25 L35 23.5 L36 30.5 L41.5 31 Z" fill="url(#eyeGlow)" stroke="#14532d" stroke-width="0.8"/>

    <!-- Cyber Nose Slot -->
    <polygon points="32,33 30,37.5 34,37.5" fill="#08070d"/>

    <!-- Cybernetic Teeth Lines -->
    <line x1="28.5" y1="45" x2="28.5" y2="51" stroke="#08070d" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="44" x2="32" y2="51" stroke="#08070d" stroke-width="2" stroke-linecap="round"/>
    <line x1="35.5" y1="45" x2="35.5" y2="51" stroke="#08070d" stroke-width="2" stroke-linecap="round"/>

    <!-- Neon Underglow Line -->
    <path d="M27 54 L37 54" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
